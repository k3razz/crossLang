<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrossLauncher — Кабинет</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <canvas id="particles-canvas"></canvas>

  <header>
    <nav class="navbar" aria-label="Основная навигация">
      <a class="brand" href="/"><span>Cross</span>Launcher</a>
      <span class="nav-arrow" aria-hidden="true">▸</span>
      <div class="nav-links">
        <a href="/">Главная</a>
        <span class="dot">•</span>
        <a href="/html/about.html">О проекте</a>
        <span class="dot">•</span>
        <a href="/html/download.html">Скачать</a>
        <a class="account-link active">Кабинет</a>
      </div>
    </nav>
  </header>

  <main class="content-container">
    <!-- БЛОК АВТОРИЗАЦИИ -->
    <div id="auth-block" class="cabinet-panel" style="display: none; max-width: 400px; margin: 0 auto;">
      <h2 style="text-align: center; color: #b9dcff; margin-bottom: 20px;">Вход в аккаунт</h2>
      
      <div style="display: flex; flex-direction: column; gap: 15px;">
        <input type="text" id="auth-username" placeholder="Никнейм" style="padding: 12px; border-radius: 10px; border: 1px solid #3d536f; background: #0b111a; color: white; font-family: monospace;">
        <input type="password" id="auth-password" placeholder="Пароль" style="padding: 12px; border-radius: 10px; border: 1px solid #3d536f; background: #0b111a; color: white; font-family: monospace;">
        
        <button id="btn-login" style="padding: 12px; border-radius: 10px; border: none; background: #42b9ff; color: #000; font-weight: bold; cursor: pointer;">Войти</button>
        <button id="btn-register" style="padding: 12px; border-radius: 10px; border: none; background: #3d536f; color: #fff; font-weight: bold; cursor: pointer;">Зарегистрироваться</button>
      </div>
      <p id="auth-error" style="color: #ff4d4d; text-align: center; margin-top: 10px; font-size: 14px; display: none;"></p>
    </div>

    <!-- БЛОК ПРОФИЛЯ -->
    <div id="profile-block" class="cabinet-panel" style="display: none;">
      <div class="profile-header">
        <div class="avatar">?</div>
        
        <div class="info-column">
          <!-- Блок с ником и ролью -->
          <div class="info-bar">
            <span id="user-role-badge" class="role-badge role-user">USER</span>
            <span id="user-name">username</span>
            <span id="user-date">register-date</span>
          </div>

          <!-- Блок с версией и статусом + кнопка выхода -->
          <div class="info-row">
            <div class="info-bar">
              <span id="launcher-version">v...</span>
            </div>
            <div class="info-bar" style="display: flex; align-items: center; gap: 10px;">
              <span id="launcher-status">Status: ...</span>
              <!-- Красная кнопка X -->
              <button id="btn-logout-x" style="background: #e60000; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; padding: 0;">X</button>
            </div>
          </div>
        </div>
      </div>
      
      <div class="profile-body"></div>
    </div>
  </main>

  <footer>
    <div>© 2026 CrossLauncher</div>
    <div>CrossLauncher is not affiliated with Mojang Studios or Microsoft.</div>
  </footer>

  <!-- МОДАЛЬНОЕ ОКНО ПОДТВЕРЖДЕНИЯ ВЫХОДА -->
  <div id="logout-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: #0b111a; padding: 30px; border-radius: 20px; text-align: center; border: 1px solid #3d536f; max-width: 300px; width: 90%;">
      <h3 style="margin-top: 0; color: #fff;">Выход из аккаунта</h3>
      <p style="color: #b9d9f2; margin-bottom: 25px;">Вы уверены, что хотите выйти?</p>
      <div style="display: flex; gap: 15px; justify-content: center;">
        <button id="btn-cancel-logout" style="padding: 10px 20px; border-radius: 10px; border: none; background: #3d536f; color: white; cursor: pointer; font-weight: bold;">Отмена</button>
        <button id="btn-confirm-logout" style="padding: 10px 20px; border-radius: 10px; border: none; background: #e60000; color: white; cursor: pointer; font-weight: bold;">Выйти</button>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrossLauncher — Кабинет</title>
  <!-- Путь к CSS из папки html на уровень выше -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <canvas id="particles-canvas"></canvas>

  <header>
    <nav class="navbar" aria-label="Основная навигация">
      <!-- Ссылка на главную из папки html -->
      <a class="brand" href="../index.html"><span>Cross</span>Launcher</a>
      <span class="nav-arrow" aria-hidden="true">▸</span>
      <div class="nav-links">
        <a href="../index.html">Главная</a>
        <span class="dot">•</span>
        <a href="about.html">О проекте</a>
        <span class="dot">•</span>
        <a href="#" onclick="alert('Раздел в разработке')">Скачать</a>
        <a class="account-link active">Кабинет</a>
      </div>
    </nav>
  </header>

  <main class="content-container">
    <div class="cabinet-panel">
      <div class="profile-header">
        <div class="avatar">?</div>
        
        <div class="info-column">
          <div class="info-bar">
            <span class="admin-tag">ADMIN</span>
            <span>{username}</span>
            <span>{register-date}</span>
          </div>

          <div class="info-row">
            <div class="info-bar">
              <span>v{launcher-version}</span>
            </div>
            
            <div class="info-bar">
              <span>Status: {status}</span>
            </div>
          </div>
        </div>
      </div>
      
      <div class="profile-body"></div>
    </div>
  </main>

  <footer>
    <div>© 2026 CrossLauncher</div>
    <div>CrossLauncher is not affiliated with Mojang Studios or Microsoft.</div>
  </footer>

  <!-- Путь к JS из папки html на уровень выше -->
  <script src="../js/main.js"></script>
</body>
</html>
